name: Package Runtime Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Runtime E2E"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: package-runtime-smoke-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  package-runtime-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: build, unpack, install, and scan from both ZIPs
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Nmap
        shell: pwsh
        run: |
          choco install nmap --version=7.99.0 --yes --no-progress
          $nmapVersion = nmap --version | Select-Object -First 1
          if ($nmapVersion -notmatch 'Nmap version 7\.99') {
            throw "Unexpected Nmap version: $nmapVersion"
          }

      - name: Install and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Exercise regular and all-in-one archives
        shell: pwsh
        env:
          SCANOPS_PACKAGE_EVIDENCE: ${{ runner.temp }}/scanops-package-runtime-smoke
        run: >-
          python scripts/package_runtime_smoke.py
          --artifacts-dir "$env:SCANOPS_PACKAGE_EVIDENCE"

      - name: Upload package runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanops-package-runtime-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/scanops-package-runtime-smoke
          if-no-files-found: warn
          retention-days: 14
