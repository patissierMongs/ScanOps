name: CI

on:
  push:
    branches: [main, "main-*"]
  pull_request:

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    # 의존성 설치까지 15분으로 자르면 Ubuntu mirror 지연이 테스트 실패처럼 보인다. 잡에는
    # 설치 여유를 주고, 실제 고아 프로세스 위험은 아래 pytest 단계 자체의 상한으로 막는다.
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install nmap
        # 대부분 테스트는 fixture XML·명령조립만 쓰지만, 단계 엔진 재스캔 테스트는
        # find_nmap() 가 바이너리를 찾아야 진행되므로 nmap 을 설치한다(워커는 스텁).
        run: sudo apt-get update && sudo apt-get install -y nmap
      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        # 실제 프로세스를 띄우는 테스트가 멈춰도 Actions 기본값인 6시간을 잡아먹지 않는다.
        timeout-minutes: 15
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Test spreadsheet import
        working-directory: frontend
        run: npm test
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Build
        working-directory: frontend
        run: npm run build
