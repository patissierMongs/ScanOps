name: CI

on:
  push:
    branches: [main, "main-*"]
  pull_request:

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    # 이 잡은 nmap 을 설치하므로 실제 프로세스를 띄우는 테스트가 있다. 상한이 없으면 한 번
    # 멈춘 실행이 기본값인 6시간을 통째로 잡아먹고, 무엇보다 '실패'가 아니라 '진행 중'으로
    # 보여서 원인을 찾을 로그조차 받을 수 없다. 로컬 전체 실행은 3분이 안 걸린다.
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install nmap
        # 대부분 테스트는 fixture XML·명령조립만 쓰지만, 단계 엔진 재스캔 테스트는
        # find_nmap() 가 바이너리를 찾아야 진행되므로 nmap 을 설치한다(워커는 스텁).
        run: sudo apt-get update && sudo apt-get install -y nmap
      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Test spreadsheet import
        working-directory: frontend
        run: npm test
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Build
        working-directory: frontend
        run: npm run build
